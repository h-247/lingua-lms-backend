user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 11m;
  server_tokens off;

  log_format sanitized '$time_iso8601 $request_id $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time upstream=$upstream_addr upstream_time=$upstream_response_time';
  access_log /var/log/nginx/access.log sanitized;

  limit_req_zone $binary_remote_addr zone=client_ip:10m rate=200r/s;

  upstream lingua_api {
    least_conn;
    server api-1:3000 max_fails=2 fail_timeout=10s;
    server api-2:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 8080;

    location /_protected_files/ {
      internal;
      alias /data/files/;
      add_header Cache-Control "private, no-store" always;
    }

    location / {
      limit_req zone=client_ip burst=400 nodelay;
      proxy_pass http://lingua_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
