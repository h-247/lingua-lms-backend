name: lingua-lms

x-api: &api
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER:-lingua}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lingua}?schema=public&connection_limit=8&pool_timeout=10
    SESSION_DATABASE_URL: postgresql://${POSTGRES_USER:-lingua}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lingua}
    FILE_ROOT: /data/files
    UPLOAD_TMP_ROOT: /data/files/.staging
    USE_X_ACCEL: "true"
    INTERNAL_FILE_PREFIX: /_protected_files
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - private-files:/data/files
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 4s
    retries: 4
    start_period: 20s
  stop_grace_period: 20s
  mem_limit: 1g
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lingua}
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - statement_timeout=8s
      - -c
      - lock_timeout=3s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lingua}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lingua}?schema=public&connection_limit=2
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  api-1:
    <<: *api

  api-2:
    <<: *api

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - private-files:/data/files:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 4
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  private-files:
